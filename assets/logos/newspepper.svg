<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>NewsPEPper</title>
  <!-- A pepper grinder, tilted, with the Python logo and PEP on it, grinding
       peppercorns. The two snakes are the paths and gradients of the PSF's
       python-logo-only.svg, with their outline unchanged. The grinder, its
       tilt, and its peppercorns are drawn here. On a light tile so it reads on
       light and dark pages. The homepage shows it inline without the tile, and
       colours the logo-ink parts for its theme. -->
  <defs>
    <linearGradient id="python-blue" gradientUnits="userSpaceOnUse" gradientTransform="matrix(.562541 0 0 .567972 -14.99112 -11.702371)" x1="26.648937" y1="20.603781" x2="135.66525" y2="114.39767">
      <stop offset="0" stop-color="#5a9fd4"/>
      <stop offset="1" stop-color="#306998"/>
    </linearGradient>
    <linearGradient id="python-yellow" gradientUnits="userSpaceOnUse" gradientTransform="matrix(.562541 0 0 .567972 -14.99112 -11.702371)" x1="150.96111" y1="192.35176" x2="112.03144" y2="137.27299">
      <stop offset="0" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#ffe873"/>
    </linearGradient>
  </defs>
  <rect class="logo-tile" width="128" height="128" rx="28" fill="#fbfbfd"/>
