  <circle cx="32" cy="32" r="10" fill="white"/>
  <circle cx="32" cy="96" r="16" fill="black"/>
  <circle cx="32" cy="96" r="10" fill="white"/>
  <circle cx="96" cy="96" r="16" fill="black"/>
  <circle cx="96" cy="96" r="10" fill="white"/>
